<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSE Recommender</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --buy: #16a34a;
    --buy-bg: #ecfdf3;
    --sell: #dc2626;
    --sell-bg: #fef2f2;
    --warn-bg: #fffbeb;
    --warn-border: #fde68a;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  nav {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 12px 16px;
  }

  .search-form {
    display: flex;
    gap: 6px;
    margin-left: auto;
  }

  .search-form input {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.88rem;
    width: 160px;
  }

  .search-form button {
    padding: 7px 14px;
    font-size: 0.88rem;
  }

  nav a {
    color: var(--muted);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 8px 12px;
    border-radius: 8px;
  }

  nav a:hover {
    background: var(--bg);
    color: var(--text);
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  h1 {
    font-size: 1.5rem;
    margin: 0 0 16px;
  }

  h2 {
    font-size: 1.15rem;
    margin: 28px 0 12px;
  }

  h3 {
    font-size: 1rem;
    margin: 16px 0 8px;
  }

  h3.buy { color: var(--buy); }
  h3.sell { color: var(--sell); }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
  }

  .flash {
    max-width: 1100px;
    margin: 16px auto 0;
    padding: 0 16px;
  }

  .flash ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .flash li {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 10px;
    font-size: 0.92rem;
  }

  .button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 4px;
  }

  .button-row form { margin: 0; }

  button {
    appearance: none;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 0.92rem;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
  }

  button:hover { background: var(--primary-dark); }

  .table-wrap {
    position: relative;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }

  .table-wrap::-webkit-scrollbar { height: 8px; }
  .table-wrap::-webkit-scrollbar-thumb {
    background: var(--muted);
    border-radius: 999px;
  }

  /* A soft fade hint on the trailing edge whenever a table is wider than
     its container, so "there's more to the right" is visible even before
     the user notices the scrollbar. Pure CSS, no JS needed: it's a fixed
     overlay that scrolls away naturally as content moves under it. */
  .table-wrap::after {
    content: "";
    position: sticky;
    display: block;
    right: 0;
    top: 0;
    width: 18px;
    height: 100%;
    margin-left: -18px;
    float: right;
    pointer-events: none;
    background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.06));
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
    white-space: nowrap;
  }

  th, td {
    text-align: left;
    padding: 7px 8px;
  }

  thead th {
    background: var(--bg);
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-bottom: 1px solid var(--border);
  }

  tbody tr + tr td {
    border-top: 1px solid var(--border);
  }

  tbody tr:hover { background: var(--bg); }

  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
  }

  .badge-buy { background: var(--buy-bg); color: var(--buy); }
  .badge-sell { background: var(--sell-bg); color: var(--sell); }
  .badge-target_hit { background: var(--buy-bg); color: var(--buy); }
  .badge-stop_loss_hit { background: var(--sell-bg); color: var(--sell); }
  .badge-still_open { background: var(--bg); color: var(--muted); }

  button.badge {
    appearance: none;
    border: 1px solid transparent;
    font-family: inherit;
    cursor: pointer;
  }

  button.badge:hover { border-color: currentColor; }

  .muted { color: var(--muted); font-size: 0.9rem; }

  dialog.drawer {
    position: fixed;
    top: 0;
    right: 0;
    margin: 0;
    height: 100vh;
    max-height: 100vh;
    width: min(420px, 92vw);
    max-width: 92vw;
    border: none;
    border-left: 1px solid var(--border);
    white-space: normal;
    overflow-x: hidden;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
  }

  dialog.drawer::backdrop {
    background: rgba(17, 24, 39, 0.35);
  }

  dialog.drawer[open] {
    animation: drawer-slide-in 0.18s ease-out;
  }

  @keyframes drawer-slide-in {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }

  .drawer-close {
    background: none;
    color: var(--muted);
    padding: 6px 10px;
    float: right;
  }

  .drawer-close:hover { background: var(--bg); color: var(--text); }

  .channel-chart { width: 100%; height: auto; display: block; margin: 12px 0; }

  @media (max-width: 640px) {
    nav { justify-content: space-between; padding: 10px; }
    nav a { padding: 6px 8px; font-size: 0.88rem; }
    main { padding: 16px 10px 40px; }
    .card { padding: 12px; border-radius: 8px; }
    .button-row button { width: 100%; }
    .button-row { flex-direction: column; }
    .search-form { width: 100%; margin-left: 0; }
    .search-form input { width: auto; flex: 1; }
    dialog.drawer { width: 100vw; max-width: 100vw; }
  }

  tr.row-buy td:first-child { border-left: 3px solid var(--buy); }
  tr.row-sell td:first-child { border-left: 3px solid var(--sell); }
</style>
</head>
<body>
<header>
  <nav>
    <a href="{{ url_for('index') }}">Downloader</a>
    <a href="{{ url_for('recommendations') }}">Recommendations</a>
    <a href="{{ url_for('past_picks') }}">Past Picks</a>
    <form class="search-form" method="get" action="{{ url_for('stock') }}">
      <input type="text" name="symbol" placeholder="Search symbol&hellip;" value="{{ request.args.get('symbol', '') }}">
      <button type="submit">Search</button>
    </form>
  </nav>
</header>
{% with messages = get_flashed_messages() %}
{% if messages %}
<div class="flash">
  <ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
</div>
{% endif %}
{% endwith %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
